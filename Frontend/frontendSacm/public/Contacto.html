    function logout() {
        fetch('http://localhost:8080/Api/cerrarSesion', {
            method: 'POST',
            credentials: 'include'
        })
        .then(response => {
            if (response.ok) {
                alert('Sesión cerrada correctamente');
                window.location.href = '/login'; // Redirige a la página de login
            } else {
                alert('Error al cerrar sesión');
            }
        })
        .catch(error => console.error('Error:', error));
    }
